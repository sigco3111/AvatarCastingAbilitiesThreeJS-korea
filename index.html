<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>원소 조형 샌드박스 — 4원소 VFX 놀이터</title>
    <link rel="preload" as="fetch" href="./models/Standing%20Idle.fbx" crossorigin />
    <link rel="stylesheet" href="./src/ui/styles.css" />
  </head>
  <body>
    <canvas id="viewport"></canvas>

    <!-- 부팅 / 로딩 화면 -->
    <div id="loader" class="loader">
      <div class="loader__inner">
        <div class="loader__sigil">
          <span class="sigil sigil--fire"></span>
          <span class="sigil sigil--water"></span>
          <span class="sigil sigil--earth"></span>
          <span class="sigil sigil--air"></span>
        </div>
        <h1 class="loader__title">원소 조형 샌드박스</h1>
        <div class="loader__bar"><i id="loader-fill"></i></div>
        <p class="loader__status" id="loader-status">원소들을 소환하는 중…</p>
      </div>
    </div>

    <!-- Heads-up display (populated by src/ui/HUD.js) -->
    <div id="hud" class="hud" aria-live="polite"></div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
